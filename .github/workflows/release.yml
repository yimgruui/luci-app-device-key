name: Build and Release luci-app-device-key

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建成功后是否创建/更新 GitHub Release'
        required: true
        type: boolean
        default: false
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.format }} - OpenWrt ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: ipk
            version: '24.10.8'
            extension: ipk
          - format: apk
            version: '25.12.6'
            extension: apk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Read package metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(sed -n 's/^PKG_NAME:=//p' Makefile | head -n 1 | tr -d '\r')"
          PACKAGE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1 | tr -d '\r')"
          PACKAGE_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n 1 | tr -d '\r')"
          if [[ -z "$PACKAGE_NAME" || -z "$PACKAGE_VERSION" || -z "$PACKAGE_RELEASE" ]]; then
            echo 'Unable to read package metadata from Makefile.' >&2
            exit 1
          fi
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release=$PACKAGE_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE_NAME $PACKAGE_VERSION-$PACKAGE_RELEASE"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.version }}
          PACKAGE_RELEASE: ${{ steps.metadata.outputs.release }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ "$TAG" != "v${PACKAGE_VERSION}" && "$TAG" != "v${PACKAGE_VERSION}-${PACKAGE_RELEASE}" ]]; then
            echo "Tag '$TAG' does not match Makefile version '${PACKAGE_VERSION}-${PACKAGE_RELEASE}'." >&2
            exit 1
          fi

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            zstd

      - name: Download OpenWrt SDK
        shell: bash
        env:
          OPENWRT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          SDK_INDEX="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/x86/64/"
          curl --retry 3 --retry-delay 2 -fsSL "$SDK_INDEX" -o "$RUNNER_TEMP/sdk-index.html"
          SDK_FILE="$(grep -oE 'openwrt-sdk-[^"<> ]+Linux-x86_64\.tar\.zst' "$RUNNER_TEMP/sdk-index.html" | sort -u | head -n 1 || true)"
          if [[ -z "$SDK_FILE" ]]; then
            echo "No x86/64 SDK archive found at $SDK_INDEX" >&2
            exit 1
          fi
          curl --retry 3 --retry-delay 2 -fL "${SDK_INDEX}${SDK_FILE}" -o "$RUNNER_TEMP/openwrt-sdk.tar.zst"
          SDK_DIR="$RUNNER_TEMP/openwrt-sdk-${OPENWRT_VERSION}"
          mkdir -p "$SDK_DIR"
          tar --zstd -xf "$RUNNER_TEMP/openwrt-sdk.tar.zst" -C "$SDK_DIR" --strip-components=1
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK extracted to $SDK_DIR"

      - name: Update feeds and link package source
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Makefile"
          test -d "$SDK_DIR"
          mkdir -p "$SDK_DIR/package"
          PACKAGE_LINK="$SDK_DIR/package/$PACKAGE_NAME"
          if [[ -e "$PACKAGE_LINK" || -L "$PACKAGE_LINK" ]]; then
            echo "Package path already exists: $PACKAGE_LINK" >&2
            exit 1
          fi
          ln -s "$GITHUB_WORKSPACE" "$PACKAGE_LINK"
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Compile package
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make "package/${PACKAGE_NAME}/compile" -j"$(nproc)"

      - name: Collect package files
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.metadata.outputs.name }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_EXTENSION: ${{ matrix.extension }}
          OPENWRT_VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$GITHUB_WORKSPACE/dist"
          mkdir -p "$OUTPUT_DIR"
          mapfile -t PACKAGE_FILES < <(
            find "$SDK_DIR/bin/packages" -type f \
              -name "${PACKAGE_NAME}*.${PACKAGE_EXTENSION}" \
              -print | sort
          )
          if [[ "${#PACKAGE_FILES[@]}" -eq 0 ]]; then
            echo "No ${PACKAGE_EXTENSION} package found for ${PACKAGE_NAME}." >&2
            find "$SDK_DIR/bin/packages" -type f -print || true
            exit 1
          fi
          cp "${PACKAGE_FILES[@]}" "$OUTPUT_DIR/"
          cd "$OUTPUT_DIR"
          sha256sum ./*."$PACKAGE_EXTENSION" > "SHA256SUMS-${PACKAGE_FORMAT}-openwrt-${OPENWRT_VERSION}.txt"
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: device-key-${{ matrix.format }}-openwrt-${{ matrix.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: >-
      ${{
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release)
      }}
    steps:
      - name: Checkout source for release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            PACKAGE_VERSION="$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -n 1 | tr -d '\r')"
            PACKAGE_RELEASE="$(sed -n 's/^PKG_RELEASE:=//p' Makefile | head -n 1 | tr -d '\r')"
            if [[ -z "$PACKAGE_VERSION" || -z "$PACKAGE_RELEASE" ]]; then
              echo "Unable to determine PKG_VERSION / PKG_RELEASE from Makefile." >&2
              exit 1
            fi
            TAG="v${PACKAGE_VERSION}-${PACKAGE_RELEASE}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          PACKAGE_FILES=( *.ipk *.apk )
          if [[ "${#PACKAGE_FILES[@]}" -eq 0 ]]; then
            echo 'No IPK or APK packages were downloaded.' >&2
            exit 1
          fi
          sha256sum "${PACKAGE_FILES[@]}" > SHA256SUMS.txt
          ls -lh

      - name: Generate release notes
        shell: bash
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$PREV" && "$PREV" != "$TAG" ]]; then
            CHANGES="$(git log --no-merges --pretty='- %s' "$PREV..$GITHUB_SHA" | head -n 40)"
            COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/$PREV...$TAG"
          else
            CHANGES="$(git log --no-merges --pretty='- %s' -n 20 "$GITHUB_SHA")"
            COMPARE=""
          fi
          [[ -n "$CHANGES" ]] || CHANGES="- 维护性更新"
          {
            printf '## luci-app-device-key %s\n\n' "$TAG"
            printf '%s\n\n' "每台设备自己的 SSH 密钥对：私钥在设备上生成、只在页面显示一次（存在内存里，不写闪存），设备只保留公钥并写入 authorized_keys。"
                        printf '### 兼容性\n\n| 包 | 构建环境 |\n|---|---|\n| ipk | OpenWrt 24.10.8 |\n| apk | OpenWrt 25.12.6 |\n\n'

            printf '### 安装\n\n'
            printf '```sh\n'
            printf '# OpenWrt 24.10 及更早（opkg）\n'
            printf 'opkg install luci-app-device-key_*_all.ipk\n\n'
            printf '# OpenWrt 25.12（apk）\n'
            printf 'apk add --allow-untrusted luci-app-device-key-*_all.apk\n'
            printf '```\n\n'
            printf '依赖：`%s`。安装后刷新 LuCI 页面即可。\n\n' "luci-compat dropbear openssh-keygen openssl-util"
            printf '### 本次变更\n\n%s\n\n' "$CHANGES"
            if [[ -n "$COMPARE" ]]; then printf '完整对比：%s\n\n' "$COMPARE"; fi
            printf '### 校验\n\n'
            printf '下载 `SHA256SUMS.txt` 后执行 `sha256sum -c SHA256SUMS.txt`。\n'
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: luci-app-device-key ${{ steps.release_tag.outputs.tag }}
          body_path: release-notes.md
          files: release-assets/*
